<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penjanaan Manual — Kuliah Individu</title>
<link rel="stylesheet" href="/dashboard/app.css">
<style>
  body{grid-template-columns:1fr}
  main{max-width:none;padding:24px 30px 60px}
  .wrap{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .fld input,.fld select,.fld textarea{
    font:400 14px/1.45 inherit;color:var(--ink);padding:8px 11px;
    border:1px solid var(--line);border-radius:9px;background:#fff;width:100%;
  }
  .fld textarea{resize:vertical;min-height:66px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg label{flex:1;text-align:center;padding:9px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .seg input{display:none}
  .seg input:checked + span{background:var(--teal);color:#fff}
  .seg label span{display:block;padding:9px;margin:-9px}
  .stage-wrap{
    background:#0d2b33;border-radius:var(--r);padding:14px;overflow:hidden;
    box-shadow:var(--shadow);position:sticky;top:20px;
  }
  .stage-box{width:100%;aspect-ratio:3000/1689;position:relative;overflow:hidden;border-radius:6px}
  #pratonton{
    position:absolute;top:0;left:0;width:3000px;height:1689px;border:0;
    transform-origin:0 0;background:#fff;
  }
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  .bar h1{font-size:19px;color:#fff}
  .bar .sub{color:#8fbcc3}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1>Penjanaan Manual</h1>
      <p class="sub">Untuk poster sekali-sekala (jemputan, ganti penceramah, pindaan tajuk).
         Guna enjin render yang <strong>sama</strong> dengan penjanaan pukal — hasil identik.</p>
    </div>
    <a class="btn btn-ghost" href="/">← Papan Kawalan</a>
  </div>

  <div class="wrap">
    <!-- ------------------------------- borang ------------------------------- -->
    <div class="card stack">
      <div class="fld">
        <span>Slot kuliah</span>
        <div class="seg">
          <label><input type="radio" name="slot" value="subuh"><span>Kuliah Subuh</span></label>
          <label><input type="radio" name="slot" value="maghrib" checked><span>Kuliah Maghrib</span></label>
        </div>
      </div>

      <label class="fld">Masjid / Surau
        <select id="f-masjid"></select>
      </label>

      <label class="fld">Penceramah dari registry
        <select id="f-penceramah"></select>
      </label>

      <label class="fld">Tarikh kuliah
        <input type="date" id="f-tarikh">
      </label>

      <div class="two">
        <label class="fld">Tarikh Masihi
          <input id="f-masihi" placeholder="2 Ogos 2026 (Ahad)">
        </label>
        <label class="fld">Tarikh Hijri
          <input id="f-hijri" placeholder="17 Safar 1448H">
        </label>
      </div>

      <label class="fld">Nama pada poster — satu baris setiap baris teks
        <textarea id="f-nama" spellcheck="false"></textarea>
      </label>

      <label class="fld">Tajuk / kitab
        <input id="f-tajuk">
      </label>

      <label class="fld">Teks lokasi
        <input id="f-lokasi">
      </label>

      <label class="fld">Hadis
        <textarea id="f-hadis" spellcheck="false"></textarea>
      </label>

      <label class="fld">Riwayat
        <input id="f-riwayat">
      </label>

      <label class="fld">Nama fail output
        <input id="f-fail" spellcheck="false">
      </label>

      <div class="row-gap">
        <button class="btn" id="btn-simpan">Jana &amp; simpan JPG</button>
        <button class="btn btn-ghost" id="btn-segar">Segarkan pratonton</button>
      </div>
      <p class="hint" id="status"></p>
    </div>

    <!-- ------------------------------ pratonton ------------------------------ -->
    <div class="stage-wrap">
      <div class="bar">
        <div><h1>Pratonton</h1><p class="sub">3000 × 1689 px · dikecilkan untuk paparan</p></div>
        <span class="chip" id="chip-pratonton">—</span>
      </div>
      <div class="stage-box" id="stage-box"><iframe id="pratonton" title="Pratonton poster"></iframe></div>
    </div>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="/dashboard/manual.js"></script>
</body>
</html>
